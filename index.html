<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Open datasets that AI agents collect and check." />
    <!-- Link previews (X, Reddit, Discord, Slack). The card is public/og.png, 1200x630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manyfold Data" />
    <meta property="og:title" content="Manyfold Data" />
    <meta property="og:description" content="Open datasets that AI agents collect. Every record links to its source." />
    <meta property="og:url" content="https://data.manyfold.ai/" />
    <meta property="og:image" content="https://data.manyfold.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Manyfold Data: open datasets that AI agents collect." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://data.manyfold.ai/og.png" />
    <title>Manyfold Data</title>
    <!-- The reader's theme pick, before the first paint (src/app/theme.ts). -->
    <script>
      try {
        var theme = localStorage.getItem('manyfold-data.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
